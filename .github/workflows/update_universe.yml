name: Update Stock Universe

on:
  schedule:
    - cron: '0 20 * * 0' # 20:00 UTC Sunday = 05:00 KST Monday, weekly theme refresh
    - cron: '0 20 1 * *' # 20:00 UTC on the 1st = 05:00 KST on the 2nd, monthly universe refresh
  workflow_dispatch:

jobs:
  update-universe:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh universe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_universe.py --mode auto

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/universe/stock_universe.json
          git commit -m "Update stock universe" || echo "No changes to commit"
          git push
